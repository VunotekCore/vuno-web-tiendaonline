name: Deploy Vunotek Frontend to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vuno_ramlop_ecommerce
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: pdo, pdo_mysql, openssl, mbstring
          tools: composer

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent 2>/dev/null; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i)"
            sleep 2
          done

      - name: Seed database
        run: |
          mysql -h 127.0.0.1 -uroot -proot vuno_ramlop_ecommerce < backend/database/schema.sql
          mysql -h 127.0.0.1 -uroot -proot vuno_ramlop_ecommerce < backend/database/seed.sql

      - name: Install composer dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction

      - name: Start PHP API server
        run: |
          echo "DB_HOST=127.0.0.1" > .env
          echo "DB_USER=root" >> .env
          echo "DB_PASS=root" >> .env
          echo "DB_NAME=vuno_ramlop_ecommerce" >> .env
          php -S localhost:8000 backend/dev-router.php > /tmp/php-build.log 2>&1 &
          echo "PHP_PID=$!" >> $GITHUB_ENV

      - name: Build Astro static site
        run: pnpm install --frozen-lockfile && PUBLIC_API_URL=http://127.0.0.1:8000/api pnpm build

      - name: Stop PHP API server
        run: kill ${{ env.PHP_PID }} 2>/dev/null || true

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /shop/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/
